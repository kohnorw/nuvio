# One service, one port, one .env.
#
#   cp .env.example .env   # fill it in
#   docker compose pull && docker compose up -d
#
#   admin   http://<host>:7000/admin
services:
  nuvio-livetv:
    # Prebuilt on every push to GitHub. `docker compose pull` fetches the
    # newest; `docker compose up -d --build` builds from this folder instead.
    image: ghcr.io/kohnorw/nuvio:latest
    build: .
    container_name: nuvio-livetv
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env
    volumes:
      # Your addon list, read fresh on each request: edit without rebuilding.
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
